<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment Form">
    <meta name="keywords" content="Swinburne, CWA">
    <meta name="author" content="NganBui">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
    
    <a href="http://www.swin.edu.au">
        <img src="logo.png" alt="Swinburne Logo">
    </a>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there</p>

    <form action="#" method="POST">
        <fieldset>
            <legend>Student details</legend>
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId" required pattern="\d{7,10}">
            <br><br>
            <label for="givenName">Given Name</label>
            <input type="text" id="givenName" name="givenName" required maxlength="15" pattern="[A-Za-z]+">
            
            <label for="familyName">Family Name</label>
            <input type="text" id="familyName" name="familyName" required maxlength="15" pattern="[A-Za-z]+">
        </fieldset>

        <fieldset>
            <legend>Your unit</legend>
            <input type="radio" id="unit1" name="unit" value="COS10011" required>
            <label for="unit1">COS10011</label>
            
            <input type="radio" id="unit2" name="unit" value="COS60004">
            <label for="unit2">COS60004</label>
            
            <input type="radio" id="unit3" name="unit" value="COS60007">
            <label for="unit3">COS60007</label>
            <br><br>
            
            <label for="tutor">Your Tutor</label>
            <select id="tutor" name="tutor" required>
                <option value="">Please Select</option>
                <option value="Alice">Alice</option>
                <option value="Bob">Bob</option>
                <option value="Charlie">Charlie</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Issue</legend>
            <input type="checkbox" id="issueHTML" name="issue[]" value="HTML" checked="checked">
            <label for="issueHTML">HTML</label>
            
            <input type="checkbox" id="issueCSS" name="issue[]" value="CSS">
            <label for="issueCSS">CSS</label>
            
            <input type="checkbox" id="issueJS" name="issue[]" value="JavaScript">
            <label for="issueJS">JavaScript</label>
            
            <input type="checkbox" id="issuePHP" name="issue[]" value="PHP">
            <label for="issuePHP">PHP</label>
            
            <input type="checkbox" id="issueMySQL" name="issue[]" value="MySQL">
            <label for="issueMySQL">MySQL</label>
            <br><br>
            
            <label for="description">Description of Issue</label><br>
            <textarea id="description" name="description" rows="4" cols="50" placeholder="Write description of your problem here..."></textarea>
        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>
            <label for="prefDate">Date</label>
            <input type="text" id="prefDate" name="prefDate" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
            <br><br>
            <label for="prefTime">Time</label>
            <input type="text" id="prefTime" name="prefTime" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
        </fieldset>

        <br>
        <input type="submit" value="Book">
        <input type="reset" value="Reset form">
    </form>
</body>
</html>
